services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: secure-openwebui-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: secure-openwebui-ollama
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-model-loader:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-llama3.2}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  topic-guard:
    build:
      context: .
      dockerfile: topic_guard/Dockerfile
      args:
        TOPIC_MODEL_ID: ${TOPIC_MODEL_ID:-MoritzLaurer/ModernBERT-base-zeroshot-v2.0}
        TOPIC_MODEL_REVISION: ${TOPIC_MODEL_REVISION:-d421c4545a438fd006fb43f8b981c5d908faa1e1}
        GROUNDING_MODEL_ID: ${GROUNDING_MODEL_ID:-cross-encoder/nli-MiniLM2-L6-H768}
        GROUNDING_MODEL_REVISION: ${GROUNDING_MODEL_REVISION:-b95119ce93d3e065de6214e38cd4a97b0f2f2c6d}
    image: secure-openwebui-topic-guard:local
    container_name: secure-openwebui-topic-guard
    environment:
      TOPIC_MODEL_PATH: /models/topic-model
      TOPIC_POLICY_PATH: /app/policies/topics.yaml
      TOPIC_POLICY_PROFILE: ${TOPIC_POLICY_PROFILE:-openwebui}
      GROUNDING_MODEL_PATH: /models/grounding-model
      GROUNDING_POLICY_PATH: /app/policies/grounding.yaml
    volumes:
      - ./policies/topics.yaml:/app/policies/topics.yaml:ro
      - ./policies/grounding.yaml:/app/policies/grounding.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:main-stable}
    container_name: secure-openwebui-litellm
    command: ["--config", "/app/config.yaml"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/topic_guardrail.py:/app/topic_guardrail.py:ro
      - ./litellm/grounding_guardrail.py:/app/grounding_guardrail.py:ro
      - ./grounding:/app/grounding:ro
      - ./policies/grounding.yaml:/app/policies/grounding.yaml:ro
      - ./litellm/trendai_guard.py:/app/trendai_guard.py:ro
      - ./vendor/tm-v1-ai-guard-litellm-plugin/trendai_guard.py:/app/trendai_guard_upstream.py:ro
    environment:
      TMV1_API_KEY: ${TMV1_API_KEY:?TMV1_API_KEY is required}
      TRENDAI_AI_GUARD_BASE_URL: ${TRENDAI_AI_GUARD_BASE_URL:?TRENDAI_AI_GUARD_BASE_URL is required}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-litellm}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:?UI_PASSWORD is required}
      TOPIC_GUARD_API_BASE: http://topic-guard:8080
      TOPIC_POLICY_PROFILE: ${TOPIC_POLICY_PROFILE:-openwebui}
      GROUNDING_GUARD_API_BASE: http://topic-guard:8080
      GROUNDING_POLICY_PATH: /app/policies/grounding.yaml
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model-loader:
        condition: service_completed_successfully
      topic-guard:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    restart: unless-stopped

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui
      args:
        OPEN_WEBUI_IMAGE: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0}
    image: secure-openwebui-trendai:local
    container_name: secure-openwebui
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      ENABLE_PLUGINS: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      RAG_SYSTEM_CONTEXT: "true"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      OLLAMA_BASE_URL: http://127.0.0.1:1
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is required}
    depends_on:
      litellm:
        condition: service_started
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    restart: unless-stopped

volumes:
  litellm-postgres-data: {}
  ollama-data: {}
  open-webui-data: {}
