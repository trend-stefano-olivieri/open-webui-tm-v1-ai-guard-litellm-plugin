model_list:
  - model_name: llama3.2
    litellm_params:
      model: ollama/llama3.2
      api_base: http://ollama:11434

guardrails:
  - guardrail_name: denied-topics
    litellm_params:
      guardrail: topic_guardrail.DeniedTopicsGuardrail
      mode: pre_call
      api_base: os.environ/TOPIC_GUARD_API_BASE
      policy_profile: os.environ/TOPIC_POLICY_PROFILE
      default_on: true
      fallback_on_error: block
      timeout: 15.0
      skip_system_message_in_guardrail: true

  - guardrail_name: trendai-guard
    litellm_params:
      guardrail: trendai_guard.TrendAIGuardrail
      mode: [pre_call, post_call]
      api_base: os.environ/TRENDAI_AI_GUARD_BASE_URL
      api_key: os.environ/TMV1_API_KEY
      app_name: openwebui
      default_on: true
      fallback_on_error: block
      timeout: 5.0

  - guardrail_name: grounding-annotation
    litellm_params:
      guardrail: grounding_guardrail.GroundingAnnotationGuardrail
      mode: post_call
      api_base: os.environ/GROUNDING_GUARD_API_BASE
      policy_path: os.environ/GROUNDING_POLICY_PATH
      default_on: true
      timeout: 30.0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
